services:
  - type: web
    name: ai-infra-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    region: oregon
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CORS_ORIGINS
        value: https://dashboard.shreyashere.dev
      - key: FRONTEND_BASE_URL
        value: https://dashboard.shreyashere.dev
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: APP_VERSION
        value: 0.1.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai-infra-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ai-infra-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TTL_MIN
        value: 15
      - key: JWT_REFRESH_TTL_DAYS
        value: 7
      - key: BCRYPT_ROUNDS
        value: 10
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: INGESTION_SOURCE_TYPE
        value: file
      - key: INGESTION_SOURCE_NAME
        value: render-ingest
      - key: INGESTION_INTERVAL_MIN
        value: 60
      - key: INGEST_DIR
        value: /app/data/ingest
      - key: INVITE_TOKEN_TTL_DAYS
        value: 7
      - key: RESET_TOKEN_TTL_MIN
        value: 60

  - type: worker
    name: ai-infra-worker
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    region: oregon
    plan: free
    startCommand: celery -A api.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-infra-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ai-infra-redis
          type: redis
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: INGESTION_SOURCE_TYPE
        value: file
      - key: INGESTION_SOURCE_NAME
        value: render-ingest
      - key: INGESTION_INTERVAL_MIN
        value: 60
      - key: INGEST_DIR
        value: /app/data/ingest

databases:
  - name: ai-infra-db
    region: oregon
    plan: free
